name: Build Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o vikunja-tui-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vikunja-tui-linux-amd64
          path: vikunja-tui-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: vikunja-tui-linux-amd64
